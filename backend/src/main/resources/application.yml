spring:
  application:
    name: dachjobs-backend

  jackson:
    property-naming-strategy: SNAKE_CASE

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dachjobs}
    username: ${DB_USER:dachjobs}
    password: ${DB_PASSWORD:dachjobs}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${PORT:8080}

dachjobs:
  pipeline:
    # Weekly, Monday 03:00 server time - matches the cadence the original
    # Databricks notebooks were scheduled at. Override with DACHJOBS_PIPELINE_CRON.
    cron: ${DACHJOBS_PIPELINE_CRON:0 0 3 * * MON}
  adzuna:
    base-url: https://api.adzuna.com/v1/api/jobs
    app-id: ${ADZUNA_APP_ID:}
    app-key: ${ADZUNA_APP_KEY:}
    countries: [de, at, ch]
    max-pages: 45
    results-per-page: 50
    # Software-dev vertical search terms. Swap or extend this list without
    # touching any Java code - a redeploy is all a query-term change needs.
    roles:
      - "software engineer"
      - "backend developer"
      - "frontend developer"
      - "full stack developer"
      - "java developer"
      - "python developer"
      - "javascript developer"
      - "devops engineer"
      - "site reliability engineer"
      - "mobile developer"
      - "ios developer"
      - "android developer"
  export:
    output-dir: ${EXPORT_DIR:../docs/data}
